<h2>Confirm your EventHub account</h2>
<p>Confirm your email address to finish creating your EventHub account.</p>
<p>
  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next={{ .RedirectTo }}">Confirm my email address</a>
</p>
<p>This link works once and expires in 1 hour. If it has expired, request a new one on the EventHub log-in page.</p>
<p>If you did not create an EventHub account, ignore this email.</p>
