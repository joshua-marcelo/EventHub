<h2>Reset your EventHub password</h2>
<p>Someone asked to reset the password for this EventHub account.</p>
<p>
  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery">Choose a new password</a>
</p>
<p>This link works once and expires in 1 hour.</p>
<p>If you did not ask for this, ignore this email. Your password stays the same.</p>
