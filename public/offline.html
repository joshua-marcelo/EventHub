<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>Offline · EventHub</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px 20px; background: #faf9f6; color: #0f172a; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { width: 100%; max-width: 400px; text-align: center; }
    img { display: block; margin: 0 auto 24px; }
    p.eyebrow { margin: 0 0 12px; font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: #9f2d00; }
    h1 { margin: 0; font-size: 28px; line-height: 1.15; letter-spacing: -.03em; }
    p.body { margin: 16px 0 28px; font-size: 16px; line-height: 1.6; color: #475569; }
    button { min-height: 48px; padding: 0 28px; border: 0; border-radius: 8px; background: #9f2d00; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button:hover { background: #7e2a0c; }
    button:focus-visible { outline: 2px solid #9f2d00; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" width="72" height="72" alt="">
    <p class="eyebrow">EventHub</p>
    <h1>You're offline.</h1>
    <p class="body">EventHub needs an internet connection to load events, record attendance, and access certificates. Reconnect and try again.</p>
    <button type="button" onclick="location.reload()">Try Again</button>
  </main>
</body>
</html>
